# config.yaml

worker_count: 3

postgres:
  host: localhost
  port: 5432
  user: cron_user
  password: secret
  dbname: jobsdb
  sslmode: verify-full
  certpath: certs/pg.crt
  keypath: certs/pg.key
  capath: certs/ca.crt

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  certpath: certs/redis.crt
  keypath: certs/redis.key
  capath: certs/ca.crt

kafka:
  brokers:
    - localhost:9093
  certpath: certs/kafka.crt
  keypath: certs/kafka.key
  cacertpath: certs/ca.crt
  group: job-consumers
  topic: jobs
